name: Dependabot auto-merge

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] no code of the pull request is checked out or run
    branches: [main]

permissions:
  contents: read

jobs:
  # This repository calls its own workflow by path, so a change is exercised here first.
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    uses: ./.github/workflows/dependabot-automerge.yml
    permissions:
      contents: read
      pull-requests: read
    secrets:
      AUTOMATION_APP_KEY: ${{ secrets.AUTOMATION_APP_KEY }}
