name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  ACTIONLINT: actionlint-py==1.7.12.25

jobs:
  verify:
    name: Verify (actionlint · bump test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run --spec "$ACTIONLINT" actionlint
      - run: bash tests/release-bump-test.sh

  # This repository calls its own workflows by path, so a change is exercised here first.
  automerge:
    needs: [verify]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    uses: ./.github/workflows/dependabot-automerge.yml
    permissions:
      contents: read
      pull-requests: read
    secrets:
      app-key: ${{ secrets.AUTOMATION_APP_KEY }}

  # Every caller adopts a release within a day, and a site that adopts one redeploys production:
  # only a change to a reusable workflow is worth one. Docs, tests and this file are not.
  changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      reusable: ${{ steps.diff.outputs.reusable }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$SHA" --jq '.files[].filename')
          if grep -qxE '\.github/workflows/(release|dependabot-automerge|back-merge|promote|issues)\.yml' <<< "$files"; then
            echo "reusable=true" >> "$GITHUB_OUTPUT"
          else
            echo "No reusable workflow changed, no release."
            echo "reusable=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: [verify, changes]
    if: needs.changes.outputs.reusable == 'true'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      sha: ${{ github.sha }}
