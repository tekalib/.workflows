name: Dependabot auto-merge

# Reusable. Squash-merges a Dependabot pull request once its CI passed, when it is a patch or a
# minor. A major, or an update whose type is unknown, is flagged to the maintainer instead, CI
# green or not, and so is an update nothing here will merge (ecosystem not allowed, no required
# check). A pull request carrying more than Dependabot's one commit is left to a human.
# The caller runs it on `pull_request_target`, never `pull_request`: the App key is then read on
# the base branch, from the workflow of the base branch, and no code of the pull request runs.
on:
  workflow_call:
    inputs:
      maintainer:
        description: Login asked to review, and assigned, on every update that will not merge by itself.
        type: string
        default: brei0x
      ecosystems:
        description: Space-separated Dependabot ecosystems allowed to merge (`github_actions`). Empty means all.
        type: string
        default: ''
    secrets:
      AUTOMATION_APP_KEY:
        description: Passed by name; its value is the secret of the caller's `automation` environment.
        required: true

permissions:
  contents: read

jobs:
  automerge:
    name: Auto-merge Dependabot (patch/minor), flag a major
    # The author, not github.actor: the actor is whoever acted last and can be made Dependabot on
    # a branch carrying someone else's commits. fetch-metadata verifies the first commit only
    # (Dependabot's, signed), so `commits == 1` makes it the only one.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.commits == 1
    runs-on: ubuntu-slim
    # The App key is a secret of this environment of the caller, which only `main` may use.
    environment:
      name: automation
      deployment: false
    permissions:
      contents: read
      pull-requests: read
    env:
      # One line per dependency: the squash body of a merge, the pull request body of a major.
      SUMMARY: >-
        def line: "- \(.dependencyName) \(.newVersion)";
        if length > 8 then (.[:7][] | line), "- +\(length - 7) more" else .[] | line end
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        id: metadata

      - name: Decide
        id: decide
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          ALLOWED: ${{ inputs.ecosystems }}
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          action=merge
          if [ "$UPDATE_TYPE" != version-update:semver-patch ] && [ "$UPDATE_TYPE" != version-update:semver-minor ]; then
            echo "Major or unknown update (${UPDATE_TYPE:-no type}), flagged to the maintainer."; action=flag
          elif [ -n "$ALLOWED" ] && ! grep -qw -- "$ECOSYSTEM" <<< "$ALLOWED"; then
            echo "$ECOSYSTEM is not in '$ALLOWED', handed to the maintainer."; action=none
          elif [ "$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/$BASE" --jq 'any(.[]; .type == "required_status_checks")')" != true ]; then
            echo "No required check on $BASE: the merge would not wait for CI, handed to the maintainer."; action=none
          fi
          echo "action=$action" >> "$GITHUB_OUTPUT"

      # An App token, not GITHUB_TOKEN: a merge made with GITHUB_TOKEN starts no workflow, so CI,
      # the deploy and the release would never run on it, and it may not touch .github/workflows/.
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: token
        with:
          client-id: ${{ vars.AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      # Assigned means handed over already: a rebase must not ask again for a review given since.
      - name: Hand over
        if: >-
          steps.decide.outputs.action == 'none' &&
          !contains(github.event.pull_request.assignees.*.login, inputs.maintainer)
        run: gh pr edit "$PR_URL" --add-reviewer "$MAINTAINER" --add-assignee "$MAINTAINER"
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          MAINTAINER: ${{ inputs.maintainer }}

      # --body replaces the org-wide PR_BODY squash body, a thousand lines of changelogs on a
      # grouped update. No --subject: the released version is computed from the PR title.
      # --auto: GitHub merges once the required check is green, at once when it already is.
      # --match-head-commit: a push after this run started must not arm the merge of another head.
      - name: Merge
        if: steps.decide.outputs.action == 'merge'
        run: gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" --body "$(jq -r "$SUMMARY" <<<"$UPDATED")" "$PR_URL"
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          UPDATED: ${{ steps.metadata.outputs.updated-dependencies-json }}

      # The squash body of a merge by hand is the pull request body: keep Dependabot's changelog
      # as a comment. A body already equal to the summary means this pull request is flagged.
      - name: Flag
        if: steps.decide.outputs.action == 'flag'
        run: |
          summary=$(jq -r "$SUMMARY" <<<"$UPDATED")
          body=$(gh pr view "$PR_URL" --json body --jq .body | tr -d '\r')
          if [ "$body" = "$summary" ]; then echo "Already flagged."; exit 0; fi
          gh pr comment "$PR_URL" --body-file - <<<"$body"
          gh pr edit "$PR_URL" --body "$summary" --add-reviewer "$MAINTAINER" --add-assignee "$MAINTAINER"
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATED: ${{ steps.metadata.outputs.updated-dependencies-json }}
          MAINTAINER: ${{ inputs.maintainer }}
