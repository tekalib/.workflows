name: Dependabot auto-merge

# Reusable. Squash-merges a Dependabot pull request once its CI passed, unless it is a major
# update: that one is flagged to the maintainer instead, CI green or not. The caller runs it as
# the last job of its CI, with `if: ${{ !cancelled() }}`, and passes the CI result.
on:
  workflow_call:
    inputs:
      ci-passed:
        description: Whether every CI job of the caller passed. A patch or minor merges only then.
        type: boolean
        default: true
      maintainer:
        description: Login asked to review, and assigned, on a major update.
        type: string
        default: brei0x
      ecosystems:
        description: Space-separated Dependabot ecosystems allowed to merge (`github_actions`). Empty means all.
        type: string
        default: ''
      client-id:
        description: Client ID of the GitHub App that merges. Public, not a secret.
        type: string
        default: Iv23liOK1jYJTYdTKpD5 # tekalib-automation
    secrets:
      app-key:
        description: Private key of that App. On a Dependabot run, only the Dependabot secrets are readable.
        required: true

permissions:
  contents: read

jobs:
  automerge:
    name: Auto-merge Dependabot (patch/minor), flag a major
    # The author, not github.actor: the actor is whoever acted last and can be made Dependabot on
    # a branch carrying someone else's commits. fetch-metadata then checks the commit is Dependabot's.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      # One line per dependency: the squash body of a merge, the pull request body of a major.
      SUMMARY: >-
        def line: "- \(.dependencyName) \(.newVersion)";
        if length > 8 then (.[:7][] | line), "- +\(length - 7) more" else .[] | line end
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        id: metadata

      - name: Decide
        id: decide
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          ALLOWED: ${{ inputs.ecosystems }}
          CI_PASSED: ${{ inputs.ci-passed }}
        run: |
          action=merge
          if [ "$UPDATE_TYPE" = version-update:semver-major ]; then
            echo "Major update, flagged to the maintainer."; action=flag
          elif [ -n "$ALLOWED" ] && ! grep -qw -- "$ECOSYSTEM" <<< "$ALLOWED"; then
            echo "$ECOSYSTEM is not in '$ALLOWED', left for a human."; action=none
          elif [ "$CI_PASSED" != true ]; then
            echo "CI did not pass, not merged."; action=none
          fi
          echo "action=$action" >> "$GITHUB_OUTPUT"

      # An App token, not GITHUB_TOKEN: a merge made with GITHUB_TOKEN starts no workflow, so CI,
      # the deploy and the release would never run on it, and it may not touch .github/workflows/.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: steps.decide.outputs.action != 'none'
        id: token
        with:
          client-id: ${{ inputs.client-id }}
          private-key: ${{ secrets.app-key }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      # --body replaces the org-wide PR_BODY squash body, a thousand lines of changelogs on a
      # grouped update. No --subject: the released version is computed from the PR title.
      - name: Merge
        if: steps.decide.outputs.action == 'merge'
        run: gh pr merge --squash --body "$(jq -r "$SUMMARY" <<<"$UPDATED")" "$PR_URL"
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATED: ${{ steps.metadata.outputs.updated-dependencies-json }}

      # The squash body of a merge by hand is the pull request body: keep Dependabot's changelog
      # as a comment. A body already equal to the summary means this pull request is flagged.
      - name: Flag
        if: steps.decide.outputs.action == 'flag'
        run: |
          summary=$(jq -r "$SUMMARY" <<<"$UPDATED")
          body=$(gh pr view "$PR_URL" --json body --jq .body | tr -d '\r')
          if [ "$body" = "$summary" ]; then echo "Already flagged."; exit 0; fi
          gh pr comment "$PR_URL" --body-file - <<<"$body"
          gh pr edit "$PR_URL" --body "$summary" --add-reviewer "$MAINTAINER" --add-assignee "$MAINTAINER"
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATED: ${{ steps.metadata.outputs.updated-dependencies-json }}
          MAINTAINER: ${{ inputs.maintainer }}
