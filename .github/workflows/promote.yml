name: Promote

# Reusable. `develop` -> `main` as a fast-forward: no pull request, no squash, no merge commit,
# so the two trunks stay the same commit and cannot drift. A rejected push means `main` carries
# a commit `develop` does not have; the back-merge lands it on its own, then run this again.
on:
  workflow_call:
    secrets:
      AUTOMATION_APP_KEY:
        description: Passed by name; its value is the secret of the caller's `automation` environment.
        required: true

permissions:
  contents: read

jobs:
  promote:
    name: develop → main
    runs-on: ubuntu-slim
    # The App key is a secret of this environment of the caller, which only `main` may use.
    environment:
      name: automation
      deployment: false
    concurrency:
      group: promote
    permissions:
      contents: read
      actions: read

    steps:
      # An App token, not GITHUB_TOKEN: its push starts CI on `main`, hence the production deploy.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: token
        with:
          client-id: ${{ vars.AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}
          permission-contents: write
          permission-workflows: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}
          persist-credentials: true # zizmor: ignore[artipacked] the push below needs it; no artifact is uploaded

      # `main` is meant to be always deployable. Deploy would refuse to ship a red `develop`,
      # but it would still have landed on the production trunk.
      - name: Require a green CI on develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The run must be for the very commit pushed below, not merely the latest one.
          conclusion=$(gh run list --branch develop --workflow CI --event push \
            --commit "$(git rev-parse HEAD)" --limit 1 --json conclusion --jq '.[0].conclusion')
          if [ "$conclusion" != success ]; then
            echo "CI on develop at $(git rev-parse --short HEAD): ${conclusion:-none}. Refusing to promote."
            exit 1
          fi

      - name: Fast-forward main to develop
        run: git push origin HEAD:main
