name: Back-merge

# Reusable. Merges `main` into `develop`, called on every push to `main`. Every auto-merged
# Dependabot fix lands on `main`, so without it `develop` falls behind and the next pull request
# conflicts on the lockfile.
on:
  workflow_call:
    secrets:
      AUTOMATION_APP_KEY:
        description: Passed by name; its value is the secret of the caller's `automation` environment.
        required: true

permissions:
  contents: read

jobs:
  back-merge:
    name: main → develop
    runs-on: ubuntu-slim
    # The App key is a secret of this environment of the caller, which only `main` may use.
    environment:
      name: automation
      deployment: false
    concurrency:
      group: back-merge
      cancel-in-progress: false

    steps:
      # An App token, not GITHUB_TOKEN: its push starts CI and the staging deploy. The App sits in
      # the bypass list of the Trunk Merge Flow ruleset, since this push is no pull request.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: token
        with:
          client-id: ${{ vars.AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}
          permission-contents: write
          permission-workflows: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}
          persist-credentials: true # zizmor: ignore[artipacked] the push below needs it; no artifact is uploaded

      # A conflict fails the job on purpose: resolving it is a human call, and `develop`
      # is left untouched.
      - name: Merge main into develop
        run: |
          git config user.name 'tekalib-automation[bot]'
          git config user.email '344575349+tekalib-automation[bot]@users.noreply.github.com'
          git merge --no-edit origin/main
          git push origin develop
