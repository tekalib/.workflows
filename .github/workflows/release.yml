name: Release

# Reusable. Tags a commit with the next version and publishes its GitHub release. The caller
# decides when: after a production deploy, or after a green CI of a push to the default branch.
on:
  workflow_call:
    inputs:
      sha:
        description: The commit to tag. It must be on the default branch.
        type: string
        required: true

permissions:
  contents: read

jobs:
  release:
    name: Tag and publish the release
    runs-on: ubuntu-latest
    concurrency: # two pushes in a row would otherwise compute, and race for, the same tag
      group: release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # No file holds the version: the last tag does, and the Conventional Commits added
      # since say how far to move. The strongest signal in the batch wins, it is a maximum
      # and not a sum, so one `feat!:` among a hundred chores still gives a major.
      # tests/release-bump-test.sh pins this logic: change both together.
      - name: Compute the next version
        id: next
        run: |
          last=$(git describe --tags --match 'v[0-9]*' --abbrev=0 2>/dev/null || true)
          range="${last:+$last..}HEAD"
          if [ -n "$last" ] && [ "$(git rev-list --count "$range")" -eq 0 ]; then
            echo "Nothing new since $last, no release."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          log=$(git log "$range" --format='%s%n%b')
          version=${last:-v0.0.0}
          IFS=. read -r major minor patch <<< "${version#v}"
          minor=${minor:-0}
          patch=${patch:-0}

          if grep -qE '^[a-z]+(\([^)]+\))?!:|^BREAKING[ -]CHANGE:' <<< "$log"; then
            major=$((major + 1)); minor=0; patch=0
          elif grep -qE '^feat(\([^)]+\))?:' <<< "$log"; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi

          echo "tag=v$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "last=$last" >> "$GITHUB_OUTPUT"

      # Generated notes list merged pull requests only, and most changes land by a push, a promotion
      # or a back-merge: built from the commits instead. tests/release-notes-test.sh runs this block.
      - name: Write the release notes
        if: steps.next.outputs.tag != ''
        env:
          TAG: ${{ steps.next.outputs.tag }}
          LAST: ${{ steps.next.outputs.last }}
          NOTES: ${{ runner.temp }}/notes.md
        run: |
          # >>> release-notes
          range="${LAST:+$LAST..}HEAD"
          breaking='' features='' fixes='' other=''
          while read -r hash; do
            subject=$(git show -s --format=%s "$hash")
            body=$(git show -s --format=%b "$hash")
            if [[ $subject =~ ^[a-z]+\(([^\)]+)\)!?:\ (.*)$ ]]; then
              line="- **${BASH_REMATCH[1]}**: ${BASH_REMATCH[2]}"
            elif [[ $subject =~ ^[a-z]+!?:\ (.*)$ ]]; then
              line="- ${BASH_REMATCH[1]}"
            else
              line="- $subject"
            fi
            if grep -qE '^[a-z]+(\([^)]+\))?!:' <<< "$subject" || grep -qE '^BREAKING[ -]CHANGE:' <<< "$body"; then
              breaking+="$line"$'\n'
            elif grep -qE '^feat(\([^)]+\))?:' <<< "$subject"; then
              features+="$line"$'\n'
            elif grep -qE '^fix(\([^)]+\))?:' <<< "$subject"; then
              fixes+="$line"$'\n'
            else
              other+="$line"$'\n'
            fi
          done < <(git log --no-merges --format=%H "$range")

          {
            echo "## What's Changed"
            [ -n "$breaking" ] && printf '\n### Breaking changes\n\n%s' "$breaking"
            [ -n "$features" ] && printf '\n### Features\n\n%s' "$features"
            [ -n "$fixes" ] && printf '\n### Fixes\n\n%s' "$fixes"
            [ -n "$other" ] && printf '\n### Other changes\n\n%s' "$other"
            if [ -n "$LAST" ]; then
              printf '\n**Full Changelog**: %s/%s/compare/%s...%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$LAST" "$TAG"
            else
              printf '\n**Full Changelog**: %s/%s/commits/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$TAG"
            fi
          } > "$NOTES"
          # <<< release-notes
          cat "$NOTES"

      - name: Create the release
        if: steps.next.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.next.outputs.tag }}
          NOTES: ${{ runner.temp }}/notes.md
          SHA: ${{ inputs.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Belt and braces: the commit being tagged must be on the default branch, that is
          # identical to it or behind it.
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$DEFAULT_BRANCH...$SHA" --jq .status)
          if [ "$status" != identical ] && [ "$status" != behind ]; then
            echo "::error::$SHA is $status relative to $DEFAULT_BRANCH, refusing to tag."
            exit 1
          fi

          gh release create "$TAG" --target "$SHA" --title "$TAG" --notes-file "$NOTES"
