name: Release

# Reusable. Tags a commit with the next version and publishes its GitHub release. The caller
# decides when: after a production deploy, or after a green CI of a push to the default branch.
on:
  workflow_call:
    inputs:
      sha:
        description: The commit to tag. It must be on the default branch.
        type: string
        required: true

permissions:
  contents: read

jobs:
  release:
    name: Tag and publish the release
    runs-on: ubuntu-slim
    concurrency: # two pushes in a row would otherwise compute, and race for, the same tag
      group: release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # No file holds the version: the highest `vX.Y.Z` tag does, and the Conventional Commits no
      # tag contains yet say how far to move (docs/REFERENCE.md § Versioning). One parse drives
      # both the bump and the notes; tests/release-test.sh runs this block as is.
      - name: Compute the version and write the notes
        id: next
        env:
          NOTES: ${{ runner.temp }}/notes.md
        run: |
          # >>> release
          tags=$(git tag --merged HEAD --sort=-v:refname --list 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          last=${tags%%$'\n'*}
          level=0 breaking='' features='' fixes='' other=''
          # shellcheck disable=SC2086 # $tags is split on purpose, every tag matched the pattern above
          while read -r hash; do
            subject=$(git show -s --format=%s "$hash")
            body=$(git show -s --format=%b "$hash")
            type='' scope='' bang='' description=$subject
            if [[ $subject =~ ^([A-Za-z]+)(\(([^\)]+)\))?(!)?:\ (.+)$ ]]; then
              type=$(tr '[:upper:]' '[:lower:]' <<< "${BASH_REMATCH[1]}")
              scope=${BASH_REMATCH[3]} bang=${BASH_REMATCH[4]} description=${BASH_REMATCH[5]}
            fi
            line="- ${scope:+**$scope**: }$description"$'\n'
            if [ -n "$bang" ] || grep -qE '^BREAKING[ -]CHANGE:' <<< "$body"; then
              breaking+=$line; level=3
            elif [ "$type" = feat ]; then
              features+=$line; [ "$level" -ge 2 ] || level=2
            elif [ "$type" = fix ]; then
              fixes+=$line; [ "$level" -ge 1 ] || level=1
            else
              other+=$line; [ "$level" -ge 1 ] || level=1
            fi
          done < <(git log --no-merges --format=%H HEAD --not $tags)

          if [ "$level" -eq 0 ]; then
            echo "Every commit but merges is already in ${last:-a tag}, no release."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          IFS=. read -r major minor patch <<< "${last#v}"
          major=${major:-0} minor=${minor:-0} patch=${patch:-0}
          # On 0.x a breaking change is a minor: 1.0.0 declares a stable API, a person decides it.
          if [ "$level" -eq 3 ] && [ "$major" -gt 0 ]; then
            major=$((major + 1)) minor=0 patch=0
          elif [ "$level" -ge 2 ]; then
            minor=$((minor + 1)) patch=0
          else
            patch=$((patch + 1))
          fi
          tag="v$major.$minor.$patch"

          {
            echo "## What's Changed"
            [ -n "$breaking" ] && printf '\n### Breaking changes\n\n%s' "$breaking"
            [ -n "$features" ] && printf '\n### Features\n\n%s' "$features"
            [ -n "$fixes" ] && printf '\n### Fixes\n\n%s' "$fixes"
            [ -n "$other" ] && printf '\n### Other changes\n\n%s' "$other"
            if [ -n "$last" ]; then
              printf '\n**Full Changelog**: %s/%s/compare/%s...%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$last" "$tag"
            else
              printf '\n**Full Changelog**: %s/%s/commits/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$tag"
            fi
          } > "$NOTES"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # <<< release
          cat "$NOTES"

      - name: Create the release
        if: steps.next.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.next.outputs.tag }}
          NOTES: ${{ runner.temp }}/notes.md
          SHA: ${{ inputs.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Belt and braces: the commit being tagged must be on the default branch, that is
          # identical to it or behind it.
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$DEFAULT_BRANCH...$SHA" --jq .status)
          if [ "$status" != identical ] && [ "$status" != behind ]; then
            echo "::error::$SHA is $status relative to $DEFAULT_BRANCH, refusing to tag."
            exit 1
          fi

          gh release create "$TAG" --target "$SHA" --title "$TAG" --notes-file "$NOTES"
