# actionlint configuration. Its bundled metadata predates create-github-app-token v3, where
# `client-id` replaced the deprecated `app-id`. Drop both lines once actionlint stops flagging them.
paths:
  .github/workflows/*.yml:
    ignore:
      - 'input "client-id" is not defined in action "actions/create-github-app-token@[0-9a-f]+"'
      - 'missing input "app-id" which is required by action "actions/create-github-app-token@[0-9a-f]+"'
